<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pusula – İşmer İK Asistanı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%230033A1'/%3E%3Cg transform='rotate(40 12 12)'%3E%3Cpath d='M12 4.2 14.6 12H9.4Z' fill='white'/%3E%3Cpath d='M9.4 12h5.2L12 19.8Z' fill='white' fill-opacity='.5'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='1.5' fill='%230033A1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0033A1;
    --navy-hover: #002A85;
    --blue: #2563EB;
    --tint: #EEF3FF;
    --tint-line: #C7D6FA;
    --text: #1E293B;
    --muted: #64748B;
    --faint: #94A3B8;
    --border: #E2E8F0;
    --border-input: #CAD5E2;
    --bg: #F5F7FB;
    --surface: #FFFFFF;
    --soft: #F8FAFD;
    --danger: #DC2626;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

  /* Pusula işareti: lacivert zemin üzerinde pusula iğnesi */
  .av {
    --dot: var(--navy);
    flex: none; width: 28px; height: 28px; border-radius: 30%;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, #2F6BF0 0%, #0033A1 72%);
    box-shadow: 0 2px 6px rgba(0, 51, 161, .2);
  }
  .av svg { width: 78%; height: 78%; display: block; }
  .av.lg { width: 60px; height: 60px; border-radius: 19px; box-shadow: 0 8px 20px rgba(0, 51, 161, .22); }

  /* Başlık şeridi: portal menü şeridiyle aynı lacivert */
  .hd {
    flex: none; display: flex; align-items: center; gap: 12px;
    background: var(--navy); color: #fff;
    padding: 10px 8px 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .hd .av { --dot: #fff; width: 38px; height: 38px; background: #fff; color: var(--navy); box-shadow: none; }
  .hd-text { flex: 1; min-width: 0; }
  .hd-title { font-size: 16.5px; font-weight: 700; line-height: 1.2; display: flex; align-items: center; gap: 8px; letter-spacing: .01em; }
  .hd-sub { font-size: 12.5px; opacity: .85; line-height: 1.3; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent;
    color: #fff; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: rgba(255,255,255,.12); }
  .icon-btn:focus-visible { outline-color: #fff; }
  .icon-btn[hidden] { display: none; }

  /* Mesaj alanı */
  .log {
    flex: 1; overflow-y: auto; position: relative;
    padding: 18px 14px 14px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth; overscroll-behavior: contain;
  }

  /* Karşılama */
  .welcome { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 2px 2px; }
  .w-title { font-size: 20px; font-weight: 700; margin: 14px 0 4px; line-height: 1.25; }
  .w-text { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 34ch; }
  .w-label {
    align-self: stretch; text-align: left; margin: 22px 2px 8px;
    font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  .w-hint { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

  .topics { align-self: stretch; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .topic {
    display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 10px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    text-align: left; cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .topic:hover { border-color: var(--tint-line); box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
  .topic:active { transform: scale(.98); }
  .topic:disabled { cursor: default; opacity: .55; transform: none; }
  .ti {
    flex: none; width: 36px; height: 36px; border-radius: 10px;
    background: var(--tint); color: var(--navy); display: grid; place-items: center;
  }
  .ti.sm { width: 30px; height: 30px; border-radius: 9px; }
  .tt { display: flex; flex-direction: column; min-width: 0; }
  .tn { font-size: 14px; font-weight: 500; line-height: 1.25; }
  .tc { font-size: 12px; color: var(--muted); margin-top: 1px; }

  /* Mesajlar */
  .msg { display: flex; gap: 8px; animation: gir .2s ease-out both; }
  .msg.me { align-self: flex-end; max-width: 85%; }
  .msg.bot { align-self: stretch; align-items: flex-start; padding-right: 6%; }
  .msg.bot > .av { margin-top: 2px; }
  .col { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; flex: 1; }
  .bubble { padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; max-width: 100%; }
  .me .bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .bot .bubble {
    background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 6px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  .bubble p { margin: 0; }
  .bubble p + p, .bubble p + ul, .bubble p + ol, .bubble ul + p, .bubble ol + p { margin-top: 8px; }
  .bubble ul, .bubble ol { margin: 0; padding-left: 20px; }
  .bubble li + li { margin-top: 4px; }
  .bubble li::marker { color: var(--blue); }
  .bubble strong { font-weight: 500; }
  .bubble a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .bubble a:hover { color: var(--navy); }
  .err .bubble { background: #FEF2F2; border-color: #FECACA; color: #7F1D1D; }

  .source { display: flex; align-items: center; gap: 6px; padding-left: 2px; font-size: 12px; color: var(--muted); }
  .source svg { flex: none; color: var(--blue); }

  .retry {
    border: 1px solid var(--border-input); background: var(--surface);
    border-radius: 999px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; color: var(--navy); font-weight: 500;
  }
  .retry:hover { border-color: var(--navy); }

  /* Konu kartı ve soru listeleri */
  .card {
    align-self: stretch; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; border-top-left-radius: 6px; padding: 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  .card-hd { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14.5px; margin: 0 0 10px; }
  .card-text { margin: 0 0 10px; }
  .card-alt { margin: 12px 2px 6px; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .card-hd + .card-alt { margin-top: 0; }
  .card-foot { margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); }
  .card .topics .topic { background: var(--soft); }

  .qlist { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; align-self: stretch; }
  .q {
    width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; cursor: pointer; font-size: 14px; line-height: 1.35;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .card .q { background: var(--soft); }
  .q:hover { border-color: var(--tint-line); background: #F5F8FF; }
  .q span { flex: 1; }
  .q svg { flex: none; color: var(--blue); }
  .q:disabled { cursor: default; opacity: .55; }

  .followup { align-self: stretch; margin-top: 4px; }
  .followup-title { margin: 0 2px 6px; font-size: 12px; color: var(--muted); }

  /* Yazıyor göstergesi */
  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Yazma alanı */
  .composer {
    flex: none; background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 12px 8px; padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .field {
    display: flex; align-items: flex-end; gap: 4px;
    border: 1px solid var(--border-input); border-radius: 24px; padding: 4px; background: var(--surface);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .14); }
  .tool {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; flex: none;
    color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .tool:hover { background: var(--tint); color: var(--navy); }
  .field textarea {
    flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
    padding: 9px 2px; max-height: 120px; line-height: 1.4;
    font-size: 16px; /* 16px altı iPhone'da sayfayı yakınlaştırır */
  }
  .field textarea::placeholder { color: var(--faint); }
  .send {
    width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: var(--navy); color: #fff; display: grid; place-items: center;
    transition: background-color .15s ease;
  }
  .send:hover { background: var(--navy-hover); }
  .send:disabled { background: #CBD5E1; cursor: default; }
  .meta { display: flex; align-items: flex-start; gap: 10px; padding: 7px 6px 0; font-size: 11.5px; line-height: 1.4; color: var(--muted); }
  .meta .note { flex: 1; text-align: center; }
  .meta .count { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta .count:empty { display: none; }
  .meta .count.full { color: var(--danger); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Kısa ekranlar (küçük telefonlar, portal paneli): karşılama alanı daha sıkı */
  @media (max-height: 720px) {
    .welcome { padding-top: 0; }
    .av.lg { width: 46px; height: 46px; border-radius: 15px; }
    .w-title { font-size: 18px; margin-top: 10px; }
    .w-text { font-size: 14px; }
    .w-label { margin-top: 16px; }
    .topic { min-height: 52px; padding: 8px 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .log { scroll-behavior: auto; }
    .msg { animation: none; }
    .topic, .q, .field, .send { transition: none; }
    .typing i { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="av" id="hdAv" aria-hidden="true"></div>
    <div class="hd-text">
      <div class="hd-title">Pusula</div>
      <div class="hd-sub">İşmer İK Asistanı</div>
    </div>
    <button class="icon-btn" id="newChat" type="button" aria-label="Yeni sohbet başlat" title="Yeni sohbet">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="icon-btn" id="closeBtn" type="button" aria-label="Asistanı kapat" title="Kapat" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <main class="log" id="log" role="log" aria-live="polite" aria-label="Sohbet"></main>

  <form class="composer" id="form" autocomplete="off">
    <label class="sr" for="input">Sorunuz</label>
    <div class="field">
      <button class="tool" id="topicsBtn" type="button" aria-label="Konuları göster" title="Konular">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <textarea id="input" rows="1" maxlength="300" placeholder="Sorunuzu yazın…"></textarea>
      <button class="send" id="send" type="submit" aria-label="Gönder" title="Gönder" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="meta">
      <span class="note">Pusula, İK'nın sık sorulan sorularındaki bilgilerle cevap verir. Önemli bilgileri İnsan Kaynakları'ndan teyit edin.</span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </form>
</div>

<script src="eslestirici.js"></script>
<script>
(() => {
  const MAX = 300;
  const IK_ILETISIM = "insan.kaynaklari@ismer.com.tr";
  const EMBEDDED = window.parent !== window;

  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), input = $("input"), send = $("send"), count = $("count");
  if (EMBEDDED) $("closeBtn").hidden = false;

  let SSS = [];
  let motor = null;  // eslestirici.js: soruyu SSS'de arayan motor
  let onceki = null; // son cevaplanan SSS maddesi (kısa takip soruları için)
  let sorulan = new Set();
  let onerilen = new Set();
  let bekliyor = false;

  // ---------- İkonlar ----------
  const IGNE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.7" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.3"/><g transform="rotate(40 12 12)"><path d="M12 4.4 14.6 12H9.4Z" fill="currentColor"/><path d="M9.4 12h5.2L12 19.6Z" fill="currentColor" fill-opacity=".5"/></g><circle cx="12" cy="12" r="1.5" style="fill:var(--dot)"/></svg>';
  const svg = (ic, boyut = 20) => `<svg width="${boyut}" height="${boyut}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>`;
  const ICON_CHEV = svg('<path d="m9 6 6 6-6 6"/>', 16);
  const ICON_BOOK = svg('<path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5"/><path d="M20 19v3H6.5"/>', 14);
  // Excel'deki konu adına göre ikon; yeni bir konu eklenirse soru işareti ikonu kullanılır
  const KONU_IKON = {
    "Sağlık Sigortası": '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
    "İzinler": '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
    "Maaş ve Bordro": '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    "Yemek ve Ulaşım Kartı": '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
    "Çalışma Hayatı": '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    "E-posta ve Şifre": '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    "Şube İşlemleri": '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
    "Şirket ve Başvuru": '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/>',
    _: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
  };
  const konuIkonu = (ad, boyut) => svg(KONU_IKON[ad] || KONU_IKON._, boyut);

  // Kategori "Konu / Alt başlık" biçiminde: konu kutusu "/" öncesinden gelir
  const konuAdi = (k) => (k || "").split("/")[0].trim() || "Diğer";
  const altAdi = (k) => (k || "").split("/").slice(1).join("/").trim();
  function konular() {
    const m = new Map();
    SSS.forEach((k) => {
      const ad = konuAdi(k.kategori);
      if (!m.has(ad)) m.set(ad, []);
      m.get(ad).push(k);
    });
    return m;
  }

  // ---------- Görünüm ----------
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function avatar(cls) {
    const d = el("div", "av" + (cls ? " " + cls : ""));
    d.setAttribute("aria-hidden", "true");
    d.innerHTML = IGNE;
    return d;
  }
  $("hdAv").innerHTML = IGNE;

  function asagi() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
  // Uzun cevaplarda başı kaybolmasın: sorulan soruyu ekranın üstüne getir
  function basaGetir(n) { requestAnimationFrame(() => { log.scrollTop = Math.max(0, n.offsetTop - 12); }); }

  // Cevap metnini paragraflara, madde listelerine ve tıklanabilir adreslere çevirir (HTML olarak yorumlamaz)
  const SATIR_ICI = /\*\*([^*]+)\*\*|(https?:\/\/[^\s<>()"'’]+|www\.[^\s<>()"'’]+)|([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|(\b444 ?\d{2} ?\d{2}\b)/gi;
  function baglanti(href, yazi) {
    const a = el("a", "", yazi);
    a.href = href;
    if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }
  function satirIci(ust, metin) {
    let i = 0;
    for (const m of metin.matchAll(SATIR_ICI)) {
      if (m.index > i) ust.appendChild(document.createTextNode(metin.slice(i, m.index)));
      let son = m.index + m[0].length;
      if (m[1]) ust.appendChild(el("strong", "", m[1]));
      else if (m[2]) {
        let url = m[2];
        const kuyruk = url.match(/[.,;:!?'’]+$/);
        if (kuyruk) { url = url.slice(0, -kuyruk[0].length); son -= kuyruk[0].length; }
        ust.appendChild(baglanti(url.startsWith("www.") ? "https://" + url : url, url));
      } else if (m[3]) ust.appendChild(baglanti("mailto:" + m[3], m[3]));
      else if (m[4]) ust.appendChild(baglanti("tel:" + m[4].replace(/\s/g, ""), m[4]));
      i = son;
    }
    if (i < metin.length) ust.appendChild(document.createTextNode(metin.slice(i)));
  }
  function bicimle(metin) {
    const parca = document.createDocumentFragment();
    let liste = null, tur = null;
    metin.split("\n").forEach((satir) => {
      const t = satir.trim();
      if (!t) { liste = null; return; }
      const m = t.match(/^(?:([-*•])|(\d+)[.)])\s+(.*)$/);
      if (m) {
        const yeniTur = m[2] ? "ol" : "ul";
        if (!liste || tur !== yeniTur) { liste = el(yeniTur); tur = yeniTur; parca.appendChild(liste); }
        const li = el("li");
        satirIci(li, m[3]);
        liste.appendChild(li);
      } else {
        liste = null;
        const p = el("p");
        satirIci(p, t);
        parca.appendChild(p);
      }
    });
    return parca;
  }

  function botSatiri(icerik, ek = {}) {
    const m = el("div", "msg bot" + (ek.hata ? " err" : ""));
    const kolon = el("div", "col");
    kolon.appendChild(icerik);
    m.append(avatar(), kolon);
    log.appendChild(m);
    return { m, kolon };
  }

  function mesajEkle(rol, metin, ek = {}) {
    if (rol === "kullanici") {
      const m = el("div", "msg me");
      m.appendChild(el("div", "bubble", metin));
      log.appendChild(m);
      asagi();
      return { m };
    }
    const balon = el("div", "bubble");
    if (ek.hata) balon.textContent = metin; else balon.appendChild(bicimle(metin));
    const satir = botSatiri(balon, ek);
    if (ek.kaynaklar && ek.kaynaklar.length) {
      const kayit = ek.kaynaklar.map((id) => SSS.find((k) => k.id === id)).filter(Boolean);
      if (kayit.length) {
        const s = el("div", "source");
        s.innerHTML = ICON_BOOK;
        s.appendChild(el("span", "", "Kaynak: İK SSS · " + [...new Set(kayit.map((k) => konuAdi(k.kategori)))].join(", ")));
        satir.kolon.appendChild(s);
      }
    }
    if (ek.tekrar) {
      const b = el("button", "retry", "Tekrar dene");
      b.type = "button";
      b.addEventListener("click", () => { satir.m.remove(); gonder(ek.tekrar, { tekrarMi: true }); });
      satir.kolon.appendChild(b);
    }
    return satir;
  }

  function soruButonu(k) {
    const li = el("li");
    const b = el("button", "q");
    b.type = "button";
    b.innerHTML = ICON_CHEV;
    b.prepend(el("span", "", k.soru));
    b.addEventListener("click", () => gonder(k.soru));
    li.appendChild(b);
    return li;
  }

  function konuIzgarasi() {
    const g = el("div", "topics");
    konular().forEach((liste, ad) => {
      const b = el("button", "topic");
      b.type = "button";
      b.innerHTML = `<span class="ti">${konuIkonu(ad, 20)}</span>`;
      const t = el("span", "tt");
      t.append(el("span", "tn", ad), el("span", "tc", liste.length + " soru"));
      b.appendChild(t);
      b.addEventListener("click", () => konuAc(ad));
      g.appendChild(b);
    });
    return g;
  }

  function konuAc(ad) {
    if (bekliyor) return;
    const { m: soru } = mesajEkle("kullanici", ad);
    const kart = el("div", "card");
    const hd = el("div", "card-hd");
    hd.innerHTML = `<span class="ti sm">${konuIkonu(ad, 18)}</span>`;
    hd.appendChild(el("span", "", ad + " hakkında sık sorulanlar"));
    kart.appendChild(hd);
    const gruplar = new Map();
    (konular().get(ad) || []).forEach((k) => {
      const alt = altAdi(k.kategori);
      if (!gruplar.has(alt)) gruplar.set(alt, []);
      gruplar.get(alt).push(k);
    });
    gruplar.forEach((liste, alt) => {
      if (alt && gruplar.size > 1) kart.appendChild(el("p", "card-alt", alt));
      const ul = el("ul", "qlist");
      liste.forEach((k) => ul.appendChild(soruButonu(k)));
      kart.appendChild(ul);
    });
    kart.appendChild(el("p", "card-foot", "Aradığınız soru listede yoksa aşağıya kendi cümlelerinizle yazın."));
    botSatiri(kart);
    guncelle();
    basaGetir(soru);
  }

  function konulariGoster() {
    if (bekliyor || !SSS.length) return;
    const kart = el("div", "card");
    kart.appendChild(el("p", "card-text", "Hangi konuda yardımcı olayım?"));
    kart.appendChild(konuIzgarasi());
    const { m } = botSatiri(kart);
    guncelle();
    basaGetir(m);
  }

  function ilgiliSorular(kolon, kaynaklar) {
    const ana = SSS.find((k) => k.id === kaynaklar[0]);
    if (!ana) return;
    // Daha önce sorulmuş ya da önerilmiş soruları tekrar önerme
    const oneriler = SSS.filter((k) => k.kategori === ana.kategori && k.cevap && !sorulan.has(k.id) && !onerilen.has(k.id)).slice(0, 2);
    if (!oneriler.length) return;
    oneriler.forEach((k) => onerilen.add(k.id));
    const kutu = el("section", "followup");
    kutu.setAttribute("aria-label", "İlgili sorular");
    kutu.appendChild(el("p", "followup-title", "İlgili sorular"));
    const liste = el("ul", "qlist");
    oneriler.forEach((k) => liste.appendChild(soruButonu(k)));
    kutu.appendChild(liste);
    kolon.appendChild(kutu);
  }

  function yaziyor() {
    const b = el("div", "bubble typing");
    b.innerHTML = '<i></i><i></i><i></i><span class="sr">Pusula yazıyor</span>';
    const { m } = botSatiri(b);
    asagi();
    return m;
  }

  function baslat() {
    log.replaceChildren();
    onceki = null;
    sorulan = new Set();
    onerilen = new Set();
    const w = el("section", "welcome");
    w.appendChild(avatar("lg"));
    w.appendChild(el("h1", "w-title", "Merhaba, ben Pusula"));
    w.appendChild(el("p", "w-text", "İşmer İK asistanınızım. İzin, bordro, sağlık sigortası, yemek kartı gibi konulardaki sorularınızı yanıtlarım."));
    if (SSS.length) {
      w.appendChild(el("p", "w-label", "Bir konu seçin"));
      w.appendChild(konuIzgarasi());
      w.appendChild(el("p", "w-hint", "ya da sorunuzu aşağıya kendi cümlelerinizle yazın"));
    }
    log.appendChild(w);
    log.scrollTop = 0;
  }

  // ---------- Gönderme ----------
  async function gonder(metin, { tekrarMi = false } = {}) {
    metin = (metin || "").trim();
    if (!metin || bekliyor) return;
    if (metin.length > MAX) metin = metin.slice(0, MAX);
    bekliyor = true;
    guncelle();

    const soru = tekrarMi ? null : mesajEkle("kullanici", metin).m;
    input.value = "";
    boyutla(); guncelle();
    const gosterge = yaziyor();

    try {
      // Cevap anında hazır; kısa bekleme yalnızca sohbetin doğal görünmesi için
      await new Promise((r) => setTimeout(r, 350));
      if (!motor) await yukle();
      if (!motor) throw new Error("sss_yok");
      const sonuc = motor.cevapla(metin, { onceki });
      gosterge.remove();
      cevapGoster(sonuc, soru);
    } catch (e) {
      console.error(e);
      gosterge.remove();
      mesajEkle("asistan", `Şu an yanıt veremiyorum. Biraz sonra tekrar deneyin ya da İnsan Kaynakları ile iletişime geçin (${IK_ILETISIM}).`, { hata: true, tekrar: metin });
      asagi();
    } finally {
      bekliyor = false;
      guncelle();
      if (!matchMedia("(pointer: coarse)").matches) input.focus();
    }
  }

  function cevapGoster(sonuc, soru) {
    const satir = mesajEkle("asistan", sonuc.metin, { kaynaklar: sonuc.kaynaklar });
    if (sonuc.kaynaklar.length) {
      onceki = sonuc.kaynaklar[0];
      sonuc.kaynaklar.forEach((id) => sorulan.add(id));
      ilgiliSorular(satir.kolon, sonuc.kaynaklar);
    }
    if (sonuc.tur === "oneri") {
      // "Bunu mu demek istediniz?": aday sorular buton olarak; dokununca o sorunun cevabı gelir
      const liste = el("ul", "qlist");
      sonuc.oneriler.map((id) => SSS.find((k) => k.id === id)).filter(Boolean).forEach((k) => liste.appendChild(soruButonu(k)));
      satir.kolon.appendChild(liste);
    }
    if (sonuc.tur === "bulunamadi" || sonuc.tur === "konu_disi") {
      const b = el("button", "retry", "Konulara göz atın");
      b.type = "button";
      b.addEventListener("click", konulariGoster);
      satir.kolon.appendChild(b);
    }
    basaGetir(soru || satir.m);
  }

  // ---------- Yazma alanı ----------
  function boyutla() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
  function guncelle() {
    const n = input.value.length;
    send.disabled = bekliyor || !input.value.trim();
    count.textContent = n >= MAX - 60 ? `${n}/${MAX}` : "";
    count.classList.toggle("full", n >= MAX);
    log.querySelectorAll(".q, .topic").forEach((b) => { b.disabled = bekliyor; });
  }
  input.addEventListener("input", () => { boyutla(); guncelle(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", (e) => { e.preventDefault(); gonder(input.value); });
  $("topicsBtn").addEventListener("click", konulariGoster);
  $("newChat").addEventListener("click", () => { if (!bekliyor) { baslat(); input.focus(); } });
  $("closeBtn").addEventListener("click", () => parent.postMessage({ type: "ika:kapat" }, "*"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && EMBEDDED) parent.postMessage({ type: "ika:kapat" }, "*"); });
  window.addEventListener("message", (e) => { if (e.data && e.data.type === "ika:acildi" && !matchMedia("(pointer: coarse)").matches) input.focus(); });

  // ---------- Başlangıç ----------
  // sss.json: sorular, sözlük ve sohbet cevapları (data/sss.xlsx'ten üretilir). Önizleme dosyasında sayfaya gömülüdür.
  async function yukle() {
    try {
      const bilgi = window.__SSS__ || await (await fetch("sss.json", { cache: "no-cache" })).json();
      SSS = bilgi.sorular || [];
      motor = window.Eslestirici.kur(bilgi);
    } catch (e) {
      console.error("sss_yuklenemedi", e);
    }
  }
  (async () => {
    await yukle();
    baslat();
  })();
})();
</script>
</body>
</html>
